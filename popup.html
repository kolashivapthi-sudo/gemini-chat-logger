<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #8ab4f8;
      text-align: center;
    }

    .stats {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .stats p {
      margin: 4px 0;
      font-size: 13px;
    }

    .stats span {
      color: #8ab4f8;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 10px;
      margin: 4px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-export {
      background: #0f3460;
      color: #fff;
    }

    .btn-export:hover {
      background: #1a508b;
    }

    .btn-clear {
      background: #e94560;
      color: #fff;
    }

    .btn-clear:hover {
      background: #c73550;
    }

    .status {
      text-align: center;
      font-size: 12px;
      margin-top: 8px;
      color: #4ecca3;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>Gemini Chat Logger</h1>
  <div class="stats">
    <p>Total Entries: <span id="count">0</span></p>
    <p>Rated Entries: <span id="rated">0</span></p>
  </div>
  <button class="btn-export" id="exportCsv">Export as CSV</button>
  <button class="btn-export" id="exportJson">Export as JSON</button>
  <button class="btn-clear" id="clearLogs">Clear Logs</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
